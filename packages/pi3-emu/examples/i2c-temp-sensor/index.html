<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi3-emu example: I2C temperature sensor part</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; max-width: 640px; margin: 2em auto; }
  #term { background: #000; padding: 8px; min-height: 120px; white-space: pre-wrap; }
  .card { border: 1px solid #333; border-radius: 6px; padding: 10px; margin-top: 10px; }
  .led { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #431; margin-right: 4px; }
  .led.on { background: #f43; }
</style>
</head>
<body>
<h1>I2C temperature sensor (reference part)</h1>
<p>A Wokwi-style part on <code>pi3-emu</code>: the guest runs its I2C sensor
reads while this page plays a virtual sensor. Drag the slider — the next
guest read returns your temperature.</p>
<div class="card">
  <label>Virtual temp: <input id="temp" type="range" min="0" max="50" value="26" /> <span id="tempv">26 C</span></label>
  <div>Guest last saw: <b id="seen">—</b></div>
  <div>LEDs 21..28: <span id="leds"></span></div>
  <div><button id="btn">hold BTN 29</button></div>
</div>
<pre id="term"></pre>
<script src="../../vendor/unicorn.js"></script>
<script type="module">
  import { Pi3Emulator } from '../../src/index.js';
  const term = document.getElementById('term');
  const ucMod = await window.MUnicorn();
  const emu = new Pi3Emulator(ucMod, { sliceInsns: 512 });
  let sensorTemp = 26, lastSeen = null;

  // Virtual sensor: answer every guest I2C read per the slave map
  // (reg 0x00 WHO_AM_I, 0x10 TEMP, 0x20 COUNTER++), like src/i2c.js.
  let counter = 0;
  const i2c = emu.attachI2c(0x3f804000, (msg) => {
    if (msg.type !== 'i2c-read') return;
    let v = 0;
    if (msg.reg === 0x00) v = 0x68;
    else if (msg.reg === 0x10) v = sensorTemp & 0xff;
    else if (msg.reg === 0x20) v = (++counter) & 0xff;
    const bytes = new Array(Math.max(1, msg.dlen || 1)).fill(0);
    bytes[0] = v;
    if (msg.reg === 0x10 && bytes.length > 1) bytes[1] = 0;
    i2c.bridgeRx({ bytes });
  });

  const elf = new Uint8Array(await (await fetch('../../firmware/i2c.elf')).arrayBuffer());
  await emu.loadFirmware(elf);
  const paint = () => {
    term.textContent = emu.consoleText;
    document.getElementById('seen').textContent = lastSeen === null ? '—' : lastSeen + ' C';
    document.getElementById('leds').innerHTML =
      emu.ledLevels().map((on) => `<span class="led${on ? ' on' : ''}"></span>`).join('');
  };
  // The i2c guest parks on I2C_DONE: poll its state.
  const timer = setInterval(() => {
    emu.runSlice(512);
    const m = emu.consoleText.match(/temp = (\d+) C/);
    if (m) lastSeen = Number(m[1]);
    paint();
    if (i2c.state.done) clearInterval(timer);
  }, 30);

  const slider = document.getElementById('temp');
  slider.addEventListener('input', () => {
    sensorTemp = Number(slider.value);
    document.getElementById('tempv').textContent = sensorTemp + ' C';
  });
  const btn = document.getElementById('btn');
  btn.addEventListener('pointerdown', () => emu.setButton(true));
  btn.addEventListener('pointerup', () => emu.setButton(false));
</script>
</body>
</html>
