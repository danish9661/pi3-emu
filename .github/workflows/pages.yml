name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-unknown-none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Linux boot image (qemu-system-aarch64.data, ~38 MB initramfs) and its
      # matching load.js are COMMITTED, so the deploy is self-contained: the
      # engine (out.js/.wasm/.worker.js) and the initramfs rootfs (rootfs.bin,
      # a gzipped cpio loaded via -initrd) are all in-repo. N4 (pi3-ctl) stays
      # live and boot is fast (no SD/MMC emulation). Do NOT fetch ktock's
      # SD-based .data here -- it would overwrite our initramfs image.

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
