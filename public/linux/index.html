<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raspberry Pi 3 (BCM2837) — Linux on QEMU Wasm</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c0c; color: #ddd;
        font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      header { padding: 6px 10px; font-size: 13px; background: #161616;
        border-bottom: 1px solid #2a2a2a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      header b { color: #fff; font-weight: 600; }
      header .hint { color: #888; font-size: 12px; }
      .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
      .tools input[type=text] { background: #0e0e0e; color: #ddd; border: 1px solid #333;
        border-radius: 4px; padding: 3px 6px; font-size: 12px; width: 200px; }
      .tools button { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a;
        border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
      .tools button:hover { background: #333; }
      .tools button.gpioBtn { min-width: 30px; padding: 3px 6px; }
      .tools button.gpioBtn.on { background: #2c5; color: #041; border-color: #2c5; }
      #terminal { flex: 1 1 auto; padding: 6px; }
      #terminal .xterm { height: 100%; }
      #coi { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0c0c0c; color: #aaa; font-size: 14px; z-index: 10; }
      #coi.hidden { display: none; }
      #boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #0c0c0c; color: #ddd; }
      #boot.hidden { display: none; }
      #boot .title { font-size: 18px; font-weight: 600; color: #fff; }
      #boot .sub { font-size: 13px; color: #9a9a9a; }
      #boot .status { font-size: 13px; color: #6cc; margin-top: 6px; min-height: 1em; }
      #boot .spin { width: 28px; height: 28px; border: 3px solid #2a2a2a; border-top-color: #6cc;
        border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <b>Raspberry Pi 3 (BCM2837)</b>
        <span class="hint">Linux on QEMU Wasm · raspi3ap · 4× Cortex-A53 · 512 MB — serial console</span>
        <span class="tools">
          <input type="file" id="upload" style="display:none" />
          <button id="uploadBtn" type="button">Upload ▸ /mnt/incoming</button>
          <input type="text" id="cmd" placeholder="type a command, e.g. hw" />
          <button id="cmdBtn" type="button">Run</button>
          <span class="hint">GPIO:</span>
          <button class="gpioBtn" data-pin="17" type="button">17</button>
          <button class="gpioBtn" data-pin="18" type="button">18</button>
          <button class="gpioBtn" data-pin="21" type="button">21</button>
          <button class="gpioBtn" data-pin="22" type="button">22</button>
          <span class="hint">Bridge:</span>
          <button class="gpioBtn bridgeIn" data-pin="23" type="button">23</button>
          <button class="gpioBtn bridgeIn" data-pin="24" type="button">24</button>
          <button class="gpioBtn bridgeIn" data-pin="25" type="button">25</button>
          <button class="gpioBtn bridgeIn" data-pin="26" type="button">26</button>
          <button class="gpioBtn bridgeIn" data-pin="27" type="button">27</button>
          <button id="bridgeTest" type="button">Echo Test</button>
          <span id="bridgeState" class="hint"></span>
          <input type="file" id="diskUpload" style="display:none" />
          <button id="saveDisk" type="button">Save Disk</button>
          <button id="loadDisk" type="button">Load Disk</button>
          <button id="resetDisk" type="button">Reset Disk</button>
          <button id="reboot" type="button" onclick="location.reload()">Reboot</button>
        </span>
      </header>
      <div id="terminal"></div>
    </div>
    <div id="coi">Establishing cross-origin isolation (threads) — one-time reload…</div>
    <div id="boot">
      <div class="spin"></div>
      <div class="title">Raspberry Pi 3 — booting Linux</div>
      <div class="sub">QEMU (TCG→WebAssembly) · raspi3ap · 4× Cortex-A53 · 512 MB</div>
      <div class="status" id="boot-status">Booting kernel…</div>
    </div>

    <!-- Register the SITE-ROOT coi Service Worker (public/coi-serviceworker.js,
         scope /pi3-emu/) so this frame is covered by the same origin-wide SW the
         main app registers. A nested per-frame SW is fragile on GitHub Pages;
         one root-scoped SW avoids the iframe reload race. -->
    <script src="../coi-serviceworker.js"></script>
    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/xterm-pty.js"></script>
    <script src="./module.js"></script>
    <script src="./load.js"></script>
    <script type="module">
      import initEmscriptenModule from './out.js';
      const xterm = new Terminal({ fontSize: 13, cursorBlink: true });
      xterm.open(document.getElementById("terminal"));
      xterm.focus();

      const { master, slave } = openpty();
      xterm.loadAddon(master);
      Module.pty = slave;
      Module["mainScriptUrlOrBlob"] = location.href.replace(/index\.html$/, "") + "out.js";

      // hide the COI splash once isolated
      const coiEl = document.getElementById("coi");
      const hideCoi = () => { if (window.crossOriginIsolated) coiEl.classList.add("hidden"); };
      hideCoi();
      setInterval(hideCoi, 500);

      // send a line (with trailing CR) to the guest over the serial console
      const sendLine = (s) => { xterm.focus(); xterm.paste(s + "\r"); };

      // ---- C3: upload a file into the VM via base64 piped through busybox ----
      const upload = document.getElementById("upload");
      document.getElementById("uploadBtn").addEventListener("click", () => upload.click());
      upload.addEventListener("change", () => {
        const f = upload.files[0]; if (!f) return;
        const name = f.name.replace(/[^A-Za-z0-9._-]/g, "_");
        const reader = new FileReader();
        reader.onload = () => {
          const b64 = Buffer.from(new Uint8Array(reader.result)).toString("base64");
          sendLine("echo " + b64 + " | base64 -d > /mnt/incoming/" + name);
          upload.value = "";
        };
        reader.readAsArrayBuffer(f);
      });

      // ---- C4/N4: browser -> real emulated GPIO pins (sysfs over serial) ----
      const cmd = document.getElementById("cmd");
      const runCmd = () => { if (cmd.value.trim()) { sendLine(cmd.value); cmd.value = ""; } };
      document.getElementById("cmdBtn").addEventListener("click", runCmd);
      cmd.addEventListener("keydown", (e) => { if (e.key === "Enter") runCmd(); });
      const gpioSet = (pin, v) =>
        sendLine("echo " + pin + " > /sys/class/gpio/export 2>/dev/null; " +
                 "echo out > /sys/class/gpio/gpio" + pin + "/direction 2>/dev/null; " +
                 "echo " + v + " > /sys/class/gpio/gpio" + pin + "/value 2>/dev/null");
      document.querySelectorAll(".gpioBtn").forEach((b) => {
        let on = false;
        b.addEventListener("click", () => {
          on = !on;
          gpioSet(b.dataset.pin, on ? 1 : 0);
          b.classList.toggle("on", on);
          b.textContent = b.dataset.pin + (on ? "*" : "");
        });
      });

      // ---- N4 (true device bridge): pi3-ctl <-> browser over postMessage ----
      // The patched qemu engine (if built with pi3-ctl) forwards guest GPIO
      // OUTPUT writes to the browser as "S <line> <0|1>\n" (worker->main via
      // postMessage), and accepts "I <line> <0|1>\n" from the browser to drive
      // a real emulated GPIO INPUT the guest can read via GPLEV. Guarded: the
      // stock prebuilt engine has no pi3_rx, so this stays inert there.
      const bridgeLevels = {};
      const bridgeReady = () =>
        typeof Module !== "undefined" && typeof Module.ccall === "function" &&
        Module.ccall("pi3_rx", "void", ["string"], ["I 0 0"]) !== undefined;
      const pi3Send = (line, v) => {
        try {
          if (typeof Module !== "undefined" && typeof Module.ccall === "function") {
            Module.ccall("pi3_rx", "void", ["string"], ["I " + line + " " + (v ? 1 : 0)]);
          }
        } catch (e) { /* pi3_rx not exported in this engine */ }
      };
      window.addEventListener("message", (e) => {
        if (typeof e.data !== "string") return;
        const m = /^S (\d+) (\d+)$/.exec(e.data);
        if (!m) return;
        const line = m[1], v = m[2] === "1";
        bridgeLevels[line] = v;
        const el = document.getElementById("bridgeState");
        if (el) el.textContent =
          "guest→browser: " +
          Object.keys(bridgeLevels).map((k) => "G" + k + (bridgeLevels[k] ? "=1" : "=0")).join(" ");
      });
      document.querySelectorAll(".bridgeIn").forEach((b) => {
        let on = false;
        b.addEventListener("click", () => {
          on = !on;
          pi3Send(b.dataset.pin, on ? 1 : 0);
          b.classList.toggle("on", on);
          b.textContent = b.dataset.pin + (on ? "*" : "");
        });
      });

      // N4 Echo Test: pulse Bridge pin 23 (browser->guest) and, if the guest
      // runs `bridge-demo`, it echoes pin23 -> pin21 (guest->browser). The
      // toolbar readout will show G21 go high then low, proving a full
      // round-trip through the pi3-ctl device.
      const bridgeTest = document.getElementById("bridgeTest");
      if (bridgeTest) {
        let busy = false;
        bridgeTest.addEventListener("click", () => {
          if (busy) return;
          busy = true;
          bridgeTest.classList.add("on");
          pi3Send(23, 1);
          setTimeout(() => {
            pi3Send(23, 0);
            bridgeTest.classList.remove("on");
            busy = false;
          }, 900);
        });
      }

      // ---- N3: snapshot the SD card image (rootfs.bin) to IndexedDB + file ----
      // Download/Upload gives a portable disk file; IndexedDB persists the loaded
      // disk across reboots. The active disk is injected over the unpacked
      // /pack/rootfs.bin in a preRun, before qemu opens the SD drive, so a
      // downloaded/uploaded disk becomes the live filesystem on next boot.
      const DISK_PATH = "/pack/rootfs.bin";
      const fsApi = () => (Module.FS || Module["FS"]);
      const toU8 = (b) => (b instanceof Uint8Array ? b : new Uint8Array(b));
      const idbOpen = () => new Promise((res, rej) => {
        const r = indexedDB.open("pi3emu", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("disk");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const idbGet = async () => {
        const db = await idbOpen();
        return await new Promise((res, rej) => {
          const rq = db.transaction("disk", "readonly").objectStore("disk").get("rootfs");
          rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
        });
      };
      const idbPut = async (buf) => {
        const db = await idbOpen();
        await new Promise((res) => {
          const tx = db.transaction("disk", "readwrite");
          tx.objectStore("disk").put(buf, "rootfs");
          tx.oncomplete = res;
        });
      };
      const idbDel = async () => {
        const db = await idbOpen();
        await new Promise((res) => {
          const tx = db.transaction("disk", "readwrite");
          tx.objectStore("disk").delete("rootfs");
          tx.oncomplete = res;
        });
      };
      const downloadBuf = (buf, name) => {
        const blob = new Blob([buf], { type: "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      };

      document.getElementById("saveDisk").addEventListener("click", async () => {
        try {
          const buf = toU8(fsApi().readFile(DISK_PATH));
          await idbPut(buf);
          window.__pi3Disk = buf;
          downloadBuf(buf, "pi3-rootfs-" + Date.now() + ".bin");
        } catch (e) { console.log("Save Disk failed: " + e); }
      });
      const diskUpload = document.getElementById("diskUpload");
      document.getElementById("loadDisk").addEventListener("click", () => diskUpload.click());
      diskUpload.addEventListener("change", () => {
        const f = diskUpload.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = async () => {
          const buf = new Uint8Array(reader.result);
          await idbPut(buf);
          window.__pi3Disk = buf;
          diskUpload.value = "";
          location.reload();
        };
        reader.readAsArrayBuffer(f);
      });
      document.getElementById("resetDisk").addEventListener("click", async () => {
        await idbDel();
        window.__pi3Disk = null;
        location.reload();
      });

      (async () => {
        // restore any persisted disk, then inject it over the unpacked
        // /pack/rootfs.bin in a preRun (runs before qemu opens the SD drive)
        try { const d = await idbGet(); if (d) window.__pi3Disk = toU8(d); } catch (e) {}
        if (Module["preRun"]) {
          Module["preRun"].push(() => {
            if (window.__pi3Disk) {
              try { fsApi().writeFile(DISK_PATH, window.__pi3Disk); } catch (e) {}
            }
          });
        }
        await initEmscriptenModule(Module);

        var oldPoll = Module["TTY"].stream_ops.poll;
        var pty = Module["pty"];
        Module["TTY"].stream_ops.poll = function (stream, timeout) {
          if (!pty.readable) return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
          return oldPoll.call(stream, timeout);
        };

        // ---- C2: real login flow (getty + login). Auto-fill credentials so the
        // user lands at the shell without typing. Also tolerate the legacy
        // "Please press Enter" path in case getty isn't active. ----
        var stage = 0, booted = false;
        var bootEl = document.getElementById("boot");
        var bootStatus = document.getElementById("boot-status");
        var setBoot = function (m) {
          if (bootStatus) bootStatus.textContent = m;
          try { window.parent.postMessage({ type: "linux-boot", phase: m }, "*"); } catch (e) {}
        };
        bootEl.addEventListener("click", function () { bootEl.classList.add("hidden"); });
        var iv = setInterval(function () {
          try {
            var rows = document.querySelector(".xterm-rows");
            if (!rows) return;
            var txt = rows.innerText;
            if (/Linux version|Please press Enter to activate this console\./.test(txt)) setBoot("Kernel up — starting userspace…");
            if (/login:/.test(txt) && stage === 0) {
              stage = 1; setBoot("Console ready — logging in…"); xterm.focus(); xterm.paste("root\r");
            } else if (/Password:/.test(txt) && stage === 1) {
              stage = 2; xterm.paste("raspberry\r");
            } else if (/Login incorrect/.test(txt)) {
              stage = 0;
            } else if (/Please press Enter to activate this console\./.test(txt) && stage === 0) {
              stage = 1; setBoot("Console ready — activating shell…"); xterm.focus(); xterm.paste("\r");
            }
            if (/~ ?#/.test(txt)) {
              if (!booted) { booted = true; setBoot("Boot complete"); }
              bootEl.classList.add("hidden");
              clearInterval(iv);
            }
          } catch (e) { console.log("AUTOACTIVATE err: " + e); }
        }, 1000);
      })();
    </script>
  </body>
</html>
