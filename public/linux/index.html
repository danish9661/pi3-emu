<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raspberry Pi 3 (BCM2837) — Linux on QEMU Wasm</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c0c; color: #ddd;
        font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      header { padding: 6px 10px; font-size: 13px; background: #161616;
        border-bottom: 1px solid #2a2a2a; display: flex; gap: 10px; align-items: center; }
      header b { color: #fff; font-weight: 600; }
      header .hint { color: #888; font-size: 12px; }
      #terminal { flex: 1 1 auto; padding: 6px; }
      #terminal .xterm { height: 100%; }
      #coi { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0c0c0c; color: #aaa; font-size: 14px; z-index: 10; }
      #coi.hidden { display: none; }
      #boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #0c0c0c; color: #ddd; }
      #boot.hidden { display: none; }
      #boot .title { font-size: 18px; font-weight: 600; color: #fff; }
      #boot .sub { font-size: 13px; color: #9a9a9a; }
      #boot .status { font-size: 13px; color: #6cc; margin-top: 6px; min-height: 1em; }
      #boot .spin { width: 28px; height: 28px; border: 3px solid #2a2a2a; border-top-color: #6cc;
        border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <b>Raspberry Pi 3 (BCM2837)</b>
        <span class="hint">Linux on QEMU Wasm · raspi3ap · 4× Cortex-A53 · 512 MB — serial console</span>
      </header>
      <div id="terminal"></div>
    </div>
    <div id="coi">Establishing cross-origin isolation (threads) — one-time reload…</div>
    <div id="boot">
      <div class="spin"></div>
      <div class="title">Raspberry Pi 3 — booting Linux</div>
      <div class="sub">QEMU (TCG→WebAssembly) · raspi3ap · 4× Cortex-A53 · 512 MB</div>
      <div class="status" id="boot-status">Booting kernel…</div>
    </div>

    <script src="./coi-serviceworker.js"></script>
    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/xterm-pty.js"></script>
    <script src="./module.js"></script>
    <script src="./load.js"></script>
    <script type="module">
      import initEmscriptenModule from './out.js';
      const xterm = new Terminal({ fontSize: 13, cursorBlink: true });
      xterm.open(document.getElementById("terminal"));
      xterm.focus();

      const { master, slave } = openpty();
      xterm.loadAddon(master);
      Module.pty = slave;
      Module["mainScriptUrlOrBlob"] = location.href.replace(/index\.html$/, "") + "out.js";

      // hide the COI splash once isolated
      const coiEl = document.getElementById("coi");
      const hideCoi = () => { if (window.crossOriginIsolated) coiEl.classList.add("hidden"); };
      hideCoi();
      const coiIv = setInterval(hideCoi, 500);

      (async () => {
        await initEmscriptenModule(Module);

        var oldPoll = Module["TTY"].stream_ops.poll;
        var pty = Module["pty"];
        Module["TTY"].stream_ops.poll = function (stream, timeout) {
          if (!pty.readable) return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
          return oldPoll.call(stream, timeout);
        };

        // Auto-activate the console: the getty prints "Please press Enter to
        // activate this console." and waits. Inject a CR so the user lands
        // straight at the shell without having to press a key. Also drive the
        // boot overlay status and hide it once the shell prompt appears.
        var activated = false, booted = false;
        var bootEl = document.getElementById("boot");
        var bootStatus = document.getElementById("boot-status");
        var setBoot = function (m) { if (bootStatus) bootStatus.textContent = m; };
        bootEl.addEventListener("click", function () { bootEl.classList.add("hidden"); });
        var iv = setInterval(function () {
          try {
            var rows = document.querySelector(".xterm-rows");
            if (!rows) return;
            var txt = rows.innerText;
            if (/Linux version/.test(txt)) setBoot("Kernel up — starting userspace…");
            if (/Please press Enter to activate this console\./.test(txt)) {
              if (!activated) {
                activated = true;
                setBoot("Console ready — activating shell…");
                xterm.focus();
                xterm.paste("\r");
              }
            }
            if (/~ #/.test(txt)) {
              if (!booted) { booted = true; setBoot("Boot complete"); }
              bootEl.classList.add("hidden");
              clearInterval(iv);
            }
          } catch (e) { console.log("AUTOACTIVATE err: " + e); }
        }, 1000);
      })();
    </script>
  </body>
</html>
